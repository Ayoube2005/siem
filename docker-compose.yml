services:
  db:
    image: postgres:16-alpine
    container_name: siem-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siem}
      POSTGRES_DB: ${POSTGRES_DB:-siem}
    volumes:
      - siem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siem} -d ${POSTGRES_DB:-siem}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    # DB is only reached by the backend on the internal network.
    expose:
      - "5432"

  backend:
    build: ./backend
    container_name: siem-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://siem:siem@db:5432/siem}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-admin}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      BRUTEFORCE_THRESHOLD: ${BRUTEFORCE_THRESHOLD:-5}
      BRUTEFORCE_WINDOW_SECONDS: ${BRUTEFORCE_WINDOW_SECONDS:-300}
      SPRAY_DISTINCT_USERS: ${SPRAY_DISTINCT_USERS:-5}
      PORTSCAN_DISTINCT_PORTS: ${PORTSCAN_DISTINCT_PORTS:-15}
      PORTSCAN_WINDOW_SECONDS: ${PORTSCAN_WINDOW_SECONDS:-120}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m

  frontend:
    build: ./frontend
    container_name: siem-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    mem_limit: 128m

volumes:
  siem_pgdata:
